apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging: stg-killy.sumire.pink. The shared sumire.pink Cloudflare Tunnel sends *.sumire.pink to
# ingress-nginx, and the Ingress host picks this overlay. Argo CD creates the namespace.
# The public demo for the hackathon's judges lives here only; production has none.
namespace: stg-killy

resources:
  - ../../base
  # Sealed for this name and namespace only (--scope strict); re-seal if either changes.
  - sealedsecret.yaml

images:
  - name: 10.1.1.10:5000/killy/server
    digest: sha256:c260af6229cf66824fea34c3b0d0f628bc7a41e83c3d179fba6b6f73bf83ac3c

patches:
  - target: { kind: Ingress, name: killy }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: stg-killy.sumire.pink
  # The demo machine's agent (not a secret: `killy agent pair` prints it).
  - target: { kind: Deployment, name: killy-server }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: KILLY_DEMO_AGENT_ID, value: a8fd6189-f2b7-4f53-abeb-ddfa41f03565 }
  # The pages allowed to call the app's API from a browser: the Web version of the demo on the
  # introduction site (not a secret). Production sets none, so it sends no CORS header.
  - target: { kind: Deployment, name: killy-server }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: KILLY_CORS_ORIGINS, value: "https://killy.sumire-sakamoto.co.jp" }
