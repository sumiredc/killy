apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Killy server and its PostgreSQL. Each overlay sets the namespace, the Ingress host, the
# server image digest and its own SealedSecret `killy-db` (keys POSTGRES_PASSWORD, KILLY_DATABASE_URL).
resources:
  - server.yaml
  - postgres.yaml
