  <radialGradient id="moon" cx=".38" cy=".36" r=".7"><stop offset="0" stop-color="#f3edff"/><stop offset=".55" stop-color="#cdb8ff"/><stop offset="1" stop-color="#9f7ae6"/></radialGradient>
