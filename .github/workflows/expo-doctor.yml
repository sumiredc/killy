name: expo-doctor

# expo-doctor checks that the installed packages are the versions the Expo SDK asks for and that the
# app's configuration is sound. The versions come from Expo's servers, so a new Expo release can turn
# it red without any change here. For that reason it does not run on every pull request: it runs when
# mobile/ changes (so an update there is checked) and every week (so drift is seen on main, where it
# blocks nothing). The fix is `npx expo install --fix` in mobile/.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/expo-doctor.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/expo-doctor.yml'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EXPO_DOCTOR_VERSION: 1.21.9

jobs:
  doctor:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Run at a fixed version; it is not a dependency of the app.
      - run: npx --yes "expo-doctor@${EXPO_DOCTOR_VERSION}"
        env:
          EXPO_NO_TELEMETRY: '1'
