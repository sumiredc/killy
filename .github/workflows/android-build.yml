name: android-build

# mobile/android is generated by `expo prebuild` and is not committed, so a change that breaks the
# native side (a native dependency, app.json, a config plugin) would be found only when an EAS build
# fails. This builds the debug APK the way EAS would configure it, without any signing key, and
# throws it away. It runs only when the app changes: a check that is skipped on other pull requests
# cannot be a required check.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  assemble-debug:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      # The values of the profiles for the judges' builds (mobile/eas.json: testflight, play, apk).
      EXPO_PUBLIC_KILLY_SERVER_URL: https://stg-killy.sumire.pink
      EXPO_PUBLIC_KILLY_DEMO: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      # --no-install: the packages are the ones npm ci installed, not the ones prebuild would pick.
      - run: npx expo prebuild --platform android --no-install --clean
      # Caches Gradle's downloads. It comes after prebuild because its cache key is made from the
      # generated Gradle files. Only runs on main write the cache; a pull request only reads it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The plain actions/cache, not the action's own caching service.
          cache-provider: basic
      # One ABI is enough to compile the native code; EAS builds all of them.
      - name: assembleDebug
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a
      - name: The APK exists
        run: ls -l android/app/build/outputs/apk/debug/app-debug.apk
