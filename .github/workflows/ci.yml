name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. Every other run (main, schedule) has a
# group of its own, because a group keeps only one waiting run and would drop the one in between:
# every commit on main must keep its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    # The agent is released for amd64 and arm64 (release.yml), and its tests check the machine they
    # run on (pidfd, reaping), so both architectures run them. macOS is where the code is developed
    # (make test), so it must build and pass there too, with the Linux-only tests left out by build tags.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go version
      - run: go vet ./...
      # -count=1: the Linux tests check the runner itself (pidfd, reaping), so a cached pass proves nothing.
      # -v: the log lists every test, so a skipped one (--- SKIP) can be seen.
      - name: go test
        run: |
          set -o pipefail
          go test -race -count=1 -v ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      # A skipped test checks nothing on this machine, so say so in the run's summary.
      - name: Skipped tests
        if: always()
        run: |
          n=$(grep -c -- '--- SKIP' "$RUNNER_TEMP/go-test.log" 2>/dev/null || true)
          n=${n:-0}
          echo "${{ matrix.os }}: ${n} skipped tests" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then echo "::warning::${n} tests were skipped on ${{ matrix.os }}"; fi

  # Things the Go tests do not catch: formatting that gofmt would change, and a go.mod or go.sum that
  # `go mod tidy` would change (a dependency used but not recorded, or recorded and unused).
  go-hygiene:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          files=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$files" ]; then
            echo "::error::gofmt would change these files (run gofmt -w):"
            echo "$files"
            exit 1
          fi
      - name: go mod tidy
        run: |
          # Prints what tidy would change and exits non-zero if there is anything.
          go mod tidy -diff

  app:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      # The Web demo is built on every merge to main (deploy-site.yml); a change that breaks that build
      # is found here, on the pull request, not after it has held up the introduction site.
      - run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web-demo"
        env:
          EXPO_PUBLIC_KILLY_SERVER_URL: https://stg-killy.sumire.pink
          EXPO_PUBLIC_KILLY_WEB_DEMO: '1'
          EXPO_NO_TELEMETRY: '1'

  # The unit tests use an in-memory store, so the SQL and the migrations run only here: tools/dbcheck
  # starts killy server on a real PostgreSQL (the version deploy/base/postgres.yaml runs), applies the
  # migrations, pairs an agent and a phone, restarts the server and checks that the link survived.
  postgres:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          # A password for this job's own database, which is gone when the job ends.
          POSTGRES_PASSWORD: killy
          POSTGRES_DB: killy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d killy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: tools/dbcheck/run.sh
        env:
          KILLY_DATABASE_URL: postgres://postgres:killy@127.0.0.1:5432/killy?sslmode=disable

  # The real server, agent and a real zombie parent on this runner: tools/e2e checks the kill
  # guarantees through the phone's API (killed, the same ID once, already gone, and that PID 1, the
  # agent and an ancestor of the agent are refused). The runner is not root, so the agent can signal
  # only this user's processes, and it is asked to kill only processes the script started.
  e2e:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.7@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
        env:
          # A password for this job's own database, which is gone when the job ends.
          POSTGRES_PASSWORD: killy
          POSTGRES_DB: killy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d killy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: uname -r
      - run: tools/e2e/run.sh
        env:
          KILLY_DATABASE_URL: postgres://postgres:killy@127.0.0.1:5432/killy?sslmode=disable
