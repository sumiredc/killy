name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    # Every job runs on the self-hosted runner while the repository is private. Write the runner
    # name literally on the runs-on line, so the switch to GitHub-hosted runners finds every job by grep.
    runs-on: arc-runner-killy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version
      - run: go vet ./...
      # -count=1: the Linux tests check the runner itself (pidfd, reaping), so a cached pass proves nothing.
      - run: go test -race -count=1 ./...
