name: vulnerabilities

# Known vulnerabilities in what the project depends on.
#   govulncheck  reports only vulnerabilities in code that this repository's packages can reach,
#                including the Go standard library of the toolchain in go.mod.
#   npm audit    covers the packages the app ships (devDependencies are left out) from the lockfile.
#   dependency-review  looks at the dependencies a pull request adds or changes.
# The weekly run finds vulnerabilities that are published after a commit, without a change here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  govulncheck:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go version
      # The tool is run at a fixed version; it is not a dependency of the module.
      - run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  npm-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
      # Reads package-lock.json and asks the registry; nothing is installed.
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
