name: probe
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: arc-runner-killy
    timeout-minutes: 10
    steps:
      - run: |
          start=$(date +%s)
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends postgresql >/dev/null
          echo "install seconds: $(( $(date +%s) - start ))"
          ls /usr/lib/postgresql
          v=$(ls /usr/lib/postgresql | sort -n | tail -1)
          export PATH=/usr/lib/postgresql/$v/bin:$PATH
          initdb -D "$RUNNER_TEMP/pg" -U postgres --auth=trust >/dev/null
          pg_ctl -D "$RUNNER_TEMP/pg" -o "-c listen_addresses=127.0.0.1 -k $RUNNER_TEMP" -l "$RUNNER_TEMP/pg.log" -w start
          psql -h 127.0.0.1 -U postgres -c 'select version()'
          echo "total seconds: $(( $(date +%s) - start ))"
          du -sh "$RUNNER_TEMP/pg"
