name: ios-build

# mobile/ios is generated by `expo prebuild` and is not committed, so a change that breaks the native
# side (a native dependency, app.json, a config plugin, a pod) would be found only when an EAS build
# fails. This builds the app for the iOS Simulator without any certificate or provisioning profile,
# and throws it away. It runs only when the app changes: a check that is skipped on other pull
# requests cannot be a required check.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-simulator:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there. macOS is where Xcode is, and it is free for a public repository.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # The values of the profiles for the judges' builds (mobile/eas.json: testflight).
      EXPO_PUBLIC_KILLY_SERVER_URL: https://stg-killy.sumire.pink
      EXPO_PUBLIC_KILLY_DEMO: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # The Xcode of the runner, so a build that needs a newer one shows it in the log.
      - run: xcodebuild -version
      - run: npm ci
      # --no-install: neither npm nor CocoaPods runs inside prebuild; the packages are the ones npm ci
      # installed, and the pods are installed on the next line.
      - run: npx expo prebuild --platform ios --no-install --clean
      - name: Install the pods
        working-directory: mobile/ios
        run: pod install
      # No signing: CODE_SIGNING_ALLOWED=NO. One architecture, because the native code only has to compile.
      - name: Build for the simulator
        working-directory: mobile/ios
        run: >
          xcodebuild build
          -workspace Killy.xcworkspace
          -scheme Killy
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
      - name: The app exists
        run: ls -d "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Killy.app"
