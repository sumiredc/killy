name: release

# A version tag (v1.2.3) builds the killy binaries for Linux and puts them on a GitHub Release of
# that tag. The Android APK (built by EAS) is attached to the same Release by hand. Users do not
# download from the Release: deploy-site.yml copies the files of the tag in site/download/VERSION
# to the site's /download/, so a new tag reaches users only when that file changes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    # Every job uses a GitHub-hosted runner: a runner inside the home LAN would let a pull request
    # from a fork run code there.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job may write: it creates the Release and uploads to it with GITHUB_TOKEN.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The binaries are published, so the build must not read a cache another run could have written.
          cache: false
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        # Static, so it runs whatever the server's libc. No -trimpath: with it, go version -m
        # does not show the -ldflags, and the version in the binary could not be checked.
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -ldflags "-X github.com/sumiredc/killy/internal/version.Version=${TAG}" \
              -o "dist/killy-linux-${arch}" ./cmd/killy
            go version -m "dist/killy-linux-${arch}" | grep -E 'ldflags|CGO_ENABLED|GOARCH'
          done
          (cd dist && sha256sum killy-linux-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Create the Release and upload the binaries
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        # Talks to the REST API with curl, so the job needs nothing but curl.
        run: |
          set -euo pipefail
          api=https://api.github.com/repos/${REPO}
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          # A draft until every file is up, so a failure never leaves a published Release without
          # its binaries. A draft left by a failed run must be deleted before the job is re-run.
          body=$(printf '{"tag_name":"%s","name":"%s","draft":true,"generate_release_notes":true}' "$TAG" "$TAG")
          # Read the whole response before parsing it: grep -m1 stops reading early, and curl would
          # then fail writing the rest of a long response (the release notes).
          created=$(curl -fsS "${auth[@]}" -X POST "$api/releases" -d "$body")
          # The response is pretty-printed, and the release's own "id" is the first one (before "author").
          id=$(grep -m1 -oE '"id": *[0-9]+' <<<"$created" | grep -oE '[0-9]+')
          test -n "$id"
          for f in dist/killy-linux-amd64 dist/killy-linux-arm64 dist/SHA256SUMS; do
            curl -fsS "${auth[@]}" -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" "https://uploads.github.com/repos/${REPO}/releases/${id}/assets?name=$(basename "$f")" > /dev/null
            echo "uploaded $(basename "$f")"
          done
          curl -fsS "${auth[@]}" -X PATCH "$api/releases/${id}" -d '{"draft":false}' > /dev/null
          echo "https://github.com/${REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
